services:
  db-next:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/db-next:/var/lib/postgresql/data:Z
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  app:
    build: ./app
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html
      - /home/ebola/Images/photos:/mountedImages
      - ${DATA_ROOT}/.transmission/data/completed:/mountedDownloaded
      - /home/ebola/Vidéos:/mountedVideos
    extra_hosts:
      - "www.${DOMAIN}:host-gateway"
    environment:
      - POSTGRES_HOST=db-next
      - POSTGRES_DB=nextcloud
    env_file:
      - .env
    depends_on:
      db-next:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  web:
    build: ./web
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html:ro
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-hsts"
      - "traefik.http.middlewares.nextcloud-hsts.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.nextcloud-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-hsts.headers.forceSTSHeader=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  news-updater:
    image: kr3ssh/nextcloud-news-updater
    restart: unless-stopped
    depends_on:
      - app
    environment:
      - NEXTCLOUD_URL=https://www.${DOMAIN}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

networks:
  traefik-public:
    external: true
