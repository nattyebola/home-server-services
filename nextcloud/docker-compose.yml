services:
  db-next:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/db-next:/var/lib/postgresql/data:Z
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  app:
    build: ./app
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      # extra external-storage mounts (host-specific) go in a local
      # docker-compose.override.yml — see docker-compose.override.yml.example
    extra_hosts:
      - "nextcloud.${DOMAIN}:host-gateway"
    environment:
      - POSTGRES_HOST=db-next
      - POSTGRES_DB=nextcloud
    env_file:
      - .env
    depends_on:
      db-next:
        condition: service_healthy
    # nextcloud:fpm-alpine only listens on the php-fpm fastcgi socket (9000),
    # no HTTP of its own — a plain TCP connect is the simplest signal that
    # the fpm master/worker are still accepting, without needing cgi-fcgi.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  web:
    build: ./web
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app
    # status.php is proxied through to app's php-fpm (see app's healthcheck
    # above) — also catches app being unreachable from web, not just nginx
    # itself being stuck.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/status.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.nextcloud.middlewares=security-headers@docker,hsts@docker"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

  news-updater:
    image: kr3ssh/nextcloud-news-updater
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - app
    environment:
      - NEXTCLOUD_URL=https://nextcloud.${DOMAIN}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "1m"

networks:
  traefik-public:
    external: true
