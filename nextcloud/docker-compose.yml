services:
  db-next:
    # Majeur FIGÉ, exception assumée au `:latest` du dépôt (voir CLAUDE.md) :
    # PostgreSQL ne lit pas un répertoire de données d'un autre majeur, un
    # `:latest` qui passerait de 15 à 16 laisserait db-next en boucle de
    # crash au démarrage. Monter de version = dump (make backup), nouveau
    # volume, réimport — à la main. 15 est en fin de vie en novembre 2027.
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/db-next:/var/lib/postgresql/data:Z
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    # Même nom que le POSTGRES_DB du service `app`. Sans lui, l'image crée au
    # premier démarrage une base au nom de POSTGRES_USER, et l'installation
    # automatique de Nextcloud échoue sur `database "nextcloud" does not exist`
    # — trouvé le 2026-09-29 en suivant docs/installation.md sur une VM neuve ;
    # en prod la base existait depuis toujours. Lu seulement à l'initialisation
    # d'un répertoire de données vide : sans effet sur une base existante.
    environment:
      - POSTGRES_DB=nextcloud
    healthcheck:
      # pg_isready ne vérifie que l'acceptation des connexions, pas l'existence
      # de la base : il restait vert pendant l'échec ci-dessus.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  app:
    build: ./app
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html
      - /etc/localtime:/etc/localtime:ro
      # extra external-storage mounts (host-specific) go in a local
      # docker-compose.override.yml — see docker-compose.override.yml.example
    extra_hosts:
      - "nextcloud.${DOMAIN}:host-gateway"
    environment:
      - POSTGRES_HOST=db-next
      - POSTGRES_DB=nextcloud
      # Réglages de reverse-proxy qu'une installation neuve n'avait pas (en prod
      # ils avaient été posés à la main par occ) : sans eux Nextcloud répond 400
      # « untrusted domain » par son domaine public. Vu le 2026-09-29 en suivant
      # docs/installation.md sur une VM neuve. NEXTCLOUD_TRUSTED_DOMAINS n'est lu
      # qu'à l'installation ; les trois suivants le sont à chaque démarrage par
      # config/reverse-proxy.config.php de l'image.
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${DOMAIN}
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.${DOMAIN}
      # Le proxy vu par php-fpm est `web` (nginx), sur nextcloud_default, dont le
      # sous-réseau est attribué par Docker (172.19 ici, 172.21 ailleurs) : toute
      # la plage privée de Docker plutôt qu'un /16 qui changerait d'une machine à
      # l'autre. Sans risque, `app` n'étant joignable que depuis ce réseau.
      - TRUSTED_PROXIES=172.16.0.0/12
    env_file:
      - .env
    depends_on:
      db-next:
        condition: service_healthy
    # nextcloud:fpm-alpine only listens on the php-fpm fastcgi socket (9000),
    # no HTTP of its own — a plain TCP connect is the simplest signal that
    # the fpm master/worker are still accepting, without needing cgi-fcgi.
    # start_period de 10 min : sur une nouvelle image, l'entrypoint fait la
    # montée de version (rsync + occ upgrade) AVANT de lancer php-fpm, ce qui
    # dure plusieurs minutes. Avec 30 s, app passait unhealthy en pleine
    # montée et `make update` (up --wait) échouait à tort. Un check réussi
    # termine la période, un démarrage normal n'attend donc pas plus.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

  web:
    build: ./web
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/.nextcloud/nexcloud:/var/www/html:ro
      - /etc/localtime:/etc/localtime:ro
    # Attendre app healthy : pendant sa montée de version, status.php échoue
    # et web passerait unhealthy à sa place (start_period de 15 s).
    depends_on:
      app:
        condition: service_healthy
        # nginx résout `app` une seule fois, au démarrage, et garde son IP : app
        # recréé seul (changement de config) = nouvelle IP, web frappe l'ancienne
        # et Traefik sert des 502. Vu le 2026-09-29 après un `make up` qui n'a
        # recréé qu'app et db-next. `restart: true` fait relancer web avec app.
        restart: true
    # status.php is proxied through to app's php-fpm (see app's healthcheck
    # above) — also catches app being unreachable from web, not just nginx
    # itself being stuck.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/status.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      # hsts défini une seule fois dans traefik/docker-compose.yml, voir
      # CLAUDE.md. PAS security-headers@docker, seule exception : ses valeurs
      # (X-Frame-Options DENY, X-Robots-Tag avec noarchive) écrasaient celles
      # de web/nginx.conf, que le contrôle de sécurité de Nextcloud compare
      # strictement (SAMEORIGIN, `noindex,nofollow`) — et DENY casse les
      # iframes same-origin de certaines apps. nginx.conf pose déjà tout.
      - "traefik.http.routers.nextcloud.middlewares=hsts@docker"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

networks:
  traefik-public:
    external: true
