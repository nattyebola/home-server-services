; Loaded after www.conf (zz- prefix) to override its low defaults --
; pm.max_children=5 was saturating every ~15min under normal Nextcloud
; cron/client load. Host has plenty of headroom (24 cores / 30G RAM).
[www]
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
