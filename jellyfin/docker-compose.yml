services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    volumes:
      - ${DATA_ROOT}/.jellyfin/cache:/cache
      - ${DATA_ROOT}/.jellyfin/config:/config
      - /home/ebola/Musique:/hosthome/Musique:ro
      - /home/ebola/Images/photos:/hosthome/Images/photos:ro
      - ${DATA_ROOT}/.transmission/data/completed:/media
      - ${DATA_ROOT}/.transmission/data/completed/.trou:/trou
    networks:
      - traefik-public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 10m

networks:
  traefik-public:
    external: true
