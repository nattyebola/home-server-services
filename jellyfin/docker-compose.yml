services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "${RENDER_GID}"
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ${DATA_ROOT}/.jellyfin/cache:/cache
      - ${DATA_ROOT}/.jellyfin/config:/config
      - /etc/localtime:/etc/localtime:ro
      # bibliothèque organisée par Sonarr/Radarr (arr/docker-compose.yml) —
      # chemin générique de ce repo, pas un choix propre à une machine,
      # donc dans le compose file de base (contrairement aux montages
      # personnels ci-dessous, qui vont dans l'override).
      - ${DATA_ROOT}/library:/library:ro
      # media library mounts (host-specific) go in a local
      # docker-compose.override.yml — see docker-compose.override.yml.example
    networks:
      - traefik-public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.jellyfin.middlewares=security-headers@docker,hsts@docker"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  traefik-public:
    external: true
