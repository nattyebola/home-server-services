services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    # Rootless : les images linuxserver.io démarrent normalement en root (s6)
    # pour chown puis descendre en PUID/PGID. Mode alternatif documenté par
    # linuxserver pour rester à cap_drop: ALL — perd juste le support des
    # Docker Mods/Custom Services (non utilisés ici).
    user: "${PUID}:${PGID}"
    tmpfs:
      - /run:uid=${PUID},gid=${PGID},exec
    # DNS du FAI renvoie 127.0.0.1 pour certains domaines d'indexeurs/trackers
    # (blocage anti-piratage côté FAI) — même fix que jellyfin/docker-compose.yml.
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ${DATA_ROOT}/.arr/prowlarr/config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - traefik-public
      # Prowlarr a aussi sa propre section Download Clients (recherche
      # interactive manuelle, indépendante de Sonarr/Radarr) — besoin du
      # même accès direct à transmission-vpn:9091 qu'eux.
      - vpn-internal
    # /ping est un endpoint Servarr non authentifié (mêmes apps que
    # sonarr/radarr ci-dessous), fait exprès pour ce genre de check.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.prowlarr.middlewares=arr-lan-only,security-headers@docker,hsts@docker"
      - "traefik.http.middlewares.arr-lan-only.ipallowlist.sourcerange=${LAN_CIDR}"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    tmpfs:
      - /run:uid=${PUID},gid=${PGID},exec
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ${DATA_ROOT}/.arr/sonarr/config:/config
      # UN SEUL montage pour /data (téléchargements) et /library (import
      # hardlink) — voir CLAUDE.md "Pièges à ne pas répéter" : link() refuse
      # de traverser deux montages Docker distincts même s'ils pointent vers
      # le même disque physique (confirmé le 2026-07-23 : Cross-device link
      # malgré un st_dev identique). Les chemins internes deviennent
      # /data_root/.transmission/data et /data_root/library — cf. remote
      # path mapping (host transmission-vpn) et root folders à reconfigurer
      # côté Sonarr en conséquence.
      - ${DATA_ROOT}:/data_root
      - ./scripts/cross-seed-notify.sh:/config/custom-cross-seed-notify.sh:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    networks:
      - default
      - traefik-public
      # Atteint transmission-vpn directement par nom de conteneur
      # (transmission-vpn:9091) — pas via transmission-proxy, qui n'existe
      # que pour l'accès humain LAN-only. Rejoindre ce réseau ne concerne
      # que sonarr, pas transmission-vpn : aucun risque pour son routing VPN.
      - vpn-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.sonarr.middlewares=arr-lan-only,security-headers@docker,hsts@docker"
      - "traefik.http.middlewares.arr-lan-only.ipallowlist.sourcerange=${LAN_CIDR}"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    tmpfs:
      - /run:uid=${PUID},gid=${PGID},exec
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - ${DATA_ROOT}/.arr/radarr/config:/config
      # même raison que sonarr ci-dessus : un seul montage pour permettre le
      # hardlink entre téléchargement et bibliothèque.
      - ${DATA_ROOT}:/data_root
      - ./scripts/cross-seed-notify.sh:/config/custom-cross-seed-notify.sh:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    networks:
      - default
      - traefik-public
      - vpn-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.radarr.middlewares=arr-lan-only,security-headers@docker,hsts@docker"
      - "traefik.http.middlewares.arr-lan-only.ipallowlist.sourcerange=${LAN_CIDR}"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  clearr:
    # 1er service du repo avec un build custom hors nextcloud/ (voir
    # arr/clearr/Dockerfile — python:3-slim + dépendances FastAPI/uvicorn/
    # Jinja2, pas d'image tierce). Web + TUI + CLI delete-by-inode partagent
    # tous arr/clearr/app/core.py, voir ce fichier pour le détail du transport
    # HTTP direct (plus de docker exec — l'ancien scripts/torrent-cleanup.py
    # tournait sur l'hôte et shellait dans les conteneurs, incompatible avec
    # rootless/cap_drop:ALL une fois lui-même conteneurisé).
    build: ./clearr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    volumes:
      # Même mount unique que sonarr/radarr (voir leur commentaire plus haut) :
      # clearr partage donc leur référentiel de chemins (/data_root/...) sans
      # aucune traduction host<->conteneur à faire.
      - ${DATA_ROOT}:/data_root
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      # DOMAIN vit dans .env.shared (pas arr/.env, donc hors env_file) — clearr
      # en a besoin pour construire les liens vers les fiches Sonarr/Radarr
      # (sonarr.${DOMAIN}/radarr.${DOMAIN}, LAN-only comme clearr lui-même).
      # Absent = pas de lien arr affiché, le reste de la vue fonctionne.
      - DOMAIN=${DOMAIN}
    networks:
      - default
      - traefik-public
      # Atteint transmission-vpn directement par nom de conteneur, comme
      # sonarr/radarr/prowlarr ci-dessus — plus de docker exec.
      - vpn-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clearr.rule=Host(`clearr.${DOMAIN}`)"
      - "traefik.http.routers.clearr.entrypoints=websecure"
      - "traefik.http.routers.clearr.tls.certresolver=letsencrypt"
      # hsts/security-headers définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.clearr.middlewares=arr-lan-only,security-headers@docker,hsts@docker"
      - "traefik.http.middlewares.arr-lan-only.ipallowlist.sourcerange=${LAN_CIDR}"
      - "traefik.http.services.clearr.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    restart: unless-stopped
    # l'image ne lance rien par défaut sans sous-commande (affiche juste
    # l'aide et quitte) — "daemon" est le mode qui tourne en continu.
    command: daemon
    user: "${PUID}:${PGID}"
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    depends_on:
      - prowlarr
      - sonarr
      - radarr
    volumes:
      - ${DATA_ROOT}/.arr/cross-seed/config:/config
      - ./cross-seed/config.js:/config/config.js:ro
      # UN SEUL montage pour dataDirs et linkDirs (config.js) — voir
      # CLAUDE.md "Pièges à ne pas répéter" : link() refuse de traverser
      # deux montages Docker distincts même sur le même disque physique,
      # donc dataDirs et linkDirs doivent être deux sous-chemins du même
      # mount. Même chemin interne (/data) que transmission-vpn : cross-seed
      # compare les chemins renvoyés par le client torrent (ex.
      # /data/completed/...) tels quels, sans remapping — contrairement à
      # Sonarr/Radarr, cross-seed n'a pas de "remote path mapping". linkDirs
      # (config.js) pointe donc vers un sous-dossier DE CE MÊME montage
      # (${DATA_ROOT}/.transmission/data/.cross-seed-links), plus besoin du
      # volume /links séparé d'avant. Perd le :ro qu'avait l'ancien montage
      # /data (nécessaire pour écrire les hardlinks quelque part dessous).
      - ${DATA_ROOT}/.transmission/data:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    networks:
      - default
      - vpn-internal
    # Pas d'endpoint non authentifié connu côté cross-seed (contrairement à
    # /ping chez Sonarr/Radarr/Prowlarr) — simple connect TCP sur le port du
    # serveur daemon (voir cross-seed/config.js), suffisant pour détecter un
    # process planté/bloqué qui n'accepte plus de connexions.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2468 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    # Mode manuel uniquement (pas de `restart:`, pas de healthcheck) — plus
    # de scheduler interne (cron @daily par défaut de l'image, désactivé le
    # 2026-07-30 : aucune valeur de CRON_SCHEDULE ne le désactive proprement,
    # seule une expression cron qui ne matche jamais existe comme
    # contournement, jugé pas assez propre). `profiles: [manual]` exclut ce
    # service de `make up STACK=arr` (docker compose up sans cible explicite
    # ignore les services profilés) — déclenché uniquement via
    # `make recyclarr-sync` (`docker compose run --rm recyclarr sync`,
    # passe des arguments à l'entrypoint donc bascule l'image en mode CLI
    # one-shot plutôt que cron). Cron host (`scripts/crontab`) enchaîne ce
    # target avec `arr-overrides` juste après pour réappliquer ce que le
    # sync vient d'écraser (voir plus bas et CLAUDE.md) : la fenêtre où ces
    # réglages sont faux se limite désormais à la durée réelle du sync
    # (quelques secondes), plus à un délai de sécurité estimé.
    user: "${PUID}:${PGID}"
    profiles:
      - manual
    depends_on:
      - sonarr
      - radarr
    volumes:
      - ${DATA_ROOT}/.arr/recyclarr/config:/config
      - ./recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

networks:
  traefik-public:
    external: true
  vpn-internal:
    external: true
    # vpn/docker-compose.yml ne fixe pas de `name:` de projet compose, donc
    # le réseau qu'il crée est préfixé par le nom du dossier (vpn_vpn-internal),
    # pas juste "vpn-internal" — on garde l'alias court ici pour la lisibilité
    # des services, en le faisant pointer vers le vrai nom externe.
    name: vpn_vpn-internal
