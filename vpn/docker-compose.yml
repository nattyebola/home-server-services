services:
  transmission-vpn:
    restart: unless-stopped
    image: haugene/transmission-openvpn:latest
    # Doit démarrer en root : configure iptables/ufw et le tunnel OpenVPN
    # (cap NET_ADMIN + /dev/net/tun) avant de faire tourner le daemon
    # Transmission sous PUID/PGID. Exception rootless documentée, comme db-next.
    #
    # Reste sur un unique réseau dédié (vpn-internal) : OpenVPN pousse une route
    # "redirect-gateway def1" qui scinde 0.0.0.0/0 en deux /1 couvrant quasiment
    # tout l'espace IPv4. Attacher ce conteneur à un second réseau docker (ex.
    # traefik-public) casse le routing (DNS/ping ne sortent plus par le tunnel) :
    # testé et confirmé pendant la migration du 2026-07-17. D'où le sidecar
    # transmission-proxy, qui fait le pont vers Traefik sans jamais toucher au tunnel.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    volumes:
      - '${DATA_ROOT}/.transmission/config:/config'
      - '${DATA_ROOT}/.transmission/data:/data'
      - '/etc/localtime:/etc/localtime:ro'
      - './custom:/etc/openvpn/custom'
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - ENABLE_UFW=true
      # Ouvre le port RPC à tout le sous-réseau connecté (vpn-internal, où vit le
      # sidecar transmission-proxy) sans passer par LOCAL_NETWORK : cette dernière
      # fait un `ip route replace <subnet> via <gw>` qui, appliqué au sous-réseau
      # sur lequel le conteneur est déjà connecté, casse le routing sortant vers
      # le tunnel (DNS/ping ne sortent plus) — testé et confirmé le 2026-07-17.
      - UFW_ALLOW_GW_NET=true
      - OPENVPN_PROVIDER=CUSTOM
      - OPENVPN_OPTS=--inactive 3600 --ping 10 --ping-exit 60
      - TRANSMISSION_PEER_PORT=40125
      # Le port fixe ci-dessus est celui ouvert côté AirVPN : sans cette ligne,
      # rien dans le dépôt ne garantit que Transmission ne reparte pas sur un
      # port aléatoire au premier démarrage d'une installation neuve. Le défaut
      # produit est déjà `false`, mais avec des images en :latest un défaut amont
      # n'est pas une garantie — et la panne serait muette : plus aucune
      # connexion entrante, ce qui se lit comme une lenteur, pas comme une panne.
      - TRANSMISSION_PEER_PORT_RANDOM_ON_START=false
      - TRANSMISSION_PORT_FORWARDING_ENABLED=true
      # Les deux dossiers sur lesquels repose toute la chaîne : `completed` est
      # ce que les arr voient via leur remote path mapping (voir
      # scripts/provision.py) et ce que cross-seed compare tel quel à ses
      # dataDirs, `incomplete` évite qu'un fichier en cours d'écriture soit vu
      # par un scan. Ce sont les défauts de l'image, explicités ici parce que le
      # reste du dépôt en dépend en dur.
      - TRANSMISSION_DOWNLOAD_DIR=/data/completed
      - TRANSMISSION_INCOMPLETE_DIR=/data/incomplete
      - TRANSMISSION_INCOMPLETE_DIR_ENABLED=true
      # 002 : les fichiers écrits par Transmission doivent rester inscriptibles
      # par le groupe, sinon Sonarr/Radarr (mêmes PUID/PGID) ne peuvent plus
      # créer leurs hardlinks dans library/ ni supprimer à l'import.
      - TRANSMISSION_UMASK=002
      - TRANSMISSION_PEER_LIMIT_GLOBAL=1000
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=100
      - TRANSMISSION_UPLOAD_SLOTS_PER_TORRENT=14
      # Transmission 4 marque par défaut ses paquets en DSCP "le" (Lower Effort,
      # RFC 8622) : une classe explicitement "à jeter en premier en cas de
      # congestion", que le réseau du fournisseur VPN comme celui du FAI peuvent
      # déprioriser. On ne veut pas de ce handicap sur du seeding.
      # "cs0" (DSCP 0, best-effort normal) et PAS "default" : Transmission 4
      # n'attend que des noms DSCP ici et rejette silencieusement "default" —
      # updateSettings.py de l'image l'écrit bien dans settings.json, puis le
      # daemon réécrit le fichier en remettant "le", sans aucun avertissement.
      - TRANSMISSION_PEER_SOCKET_TOS=cs0
      - TRANSMISSION_UTP_ENABLED=true
      - TRANSMISSION_DHT_ENABLED=true
      - TRANSMISSION_PEX_ENABLED=true
      - TRANSMISSION_LPD_ENABLED=false
      - TRANSMISSION_SCRAPE_PAUSED_TORRENTS_ENABLED=false
      - TRANSMISSION_CACHE_SIZE_MB=256
      # L'UI n'est plus jointe en direct : contrôle d'accès délégué au middleware LAN-only de Traefik.
      - TRANSMISSION_RPC_HOST_WHITELIST_ENABLED=false
      - TRANSMISSION_RPC_WHITELIST_ENABLED=false
    env_file:
      - .env
    networks:
      - vpn-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL
      - SETPCAP
      - SETFCAP
      - SYS_CHROOT
      - AUDIT_WRITE
      - FSETID
    devices:
      - /dev/net/tun
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  transmission-proxy:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    depends_on:
      transmission-vpn:
        condition: service_healthy
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - vpn-internal
      - traefik-public
    # Simple connect TCP plutôt qu'une requête RPC réelle : sans en-tête
    # X-Transmission-Session-Id, l'upstream répond 409 (comportement normal
    # du protocole RPC de Transmission), pas un 200 — un check HTTP se
    # tromperait de signal. Suffisant pour détecter nginx planté/bloqué ;
    # transmission-vpn a déjà son propre healthcheck (image haugene, voir
    # `depends_on` ci-dessus).
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=letsencrypt"
      # Client torrent : jamais exposé au WAN, seul le LAN (LAN_CIDR, .env.shared) peut l'atteindre.
      # transmission-lan-only est défini dans traefik/dynamic/lan-only.yml
      # (provider `file`), pas ici — un middleware déclaré par label ne peut
      # changer qu'en recréant le conteneur, ce qui interdit de l'ouvrir puis de
      # le refermer (`make switch-lan-only-middleware`). hsts/security-headers
      # définis une seule fois dans traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.transmission.middlewares=transmission-lan-only@file,security-headers@docker,hsts@docker"
      - "traefik.http.services.transmission.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

networks:
  vpn-internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  traefik-public:
    external: true
