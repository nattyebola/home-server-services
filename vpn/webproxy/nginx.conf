# Relais TCP brut vers le Privoxy de transmission-vpn (WEBPROXY_ENABLED).
# Fichier nginx.conf COMPLET, pas un conf.d/ : ce dernier est inclus dans le
# bloc http{}, où un bloc stream{} n'est pas accepté.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

stream {
    # DNS interne Docker, re-résolu à chaud : sans ça, nginx figerait l'IP de
    # transmission-vpn au démarrage, et un `up` qui recrée ce seul conteneur
    # (nouvelle IP sur vpn-internal) laisserait le relais pointer dans le vide.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream privoxy {
        zone privoxy 64k;
        server transmission-vpn:8118 resolve;
    }

    server {
        listen 8118;
        proxy_pass privoxy;
        # Aligné sur le socket-timeout de Privoxy (300 s) : une connexion
        # CONNECT (HTTPS) inactive un moment, onglet ouvert, ne doit pas être
        # coupée par le relais avant de l'être par le proxy lui-même.
        proxy_timeout 300s;
    }
}
