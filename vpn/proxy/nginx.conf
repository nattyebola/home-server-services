# DNS interne Docker, re-résolu à chaud — même raison que vpn/webproxy : un
# `proxy_pass http://transmission-vpn:9091` nu fige l'IP au démarrage de nginx,
# or transmission-vpn n'a pas d'IP fixe sur vpn-internal. Recréé seul (un
# `make update STACK=vpn` quand seule son image change), il en change, et ce
# relais visait l'ancienne : RPC Transmission en 502 pour Sonarr, Radarr, clearr
# et cross-seed. Oubli relevé le 2026-09-29, en cherchant les relais exposés au
# piège trouvé sur nextcloud/web.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream transmission {
    zone transmission 64k;
    server transmission-vpn:9091 resolve;
}

server {
    listen 8080;

    location / {
        proxy_pass http://transmission;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
