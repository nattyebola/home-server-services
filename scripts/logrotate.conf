# Rotation des journaux produits par ce dépôt. Lancé par cron via
# `logrotate --state __DATA_ROOT__/.logrotate.state` (voir scripts/crontab),
# donc SANS root et sans toucher à /etc/logrotate.d : le logrotate système
# tourne en root et n'a pas à connaître ce checkout, et tous les fichiers visés
# appartiennent déjà à l'utilisateur qui lance make (les conteneurs qui écrivent
# ici tournent en PUID:PGID).
#
# Les chemins __REPO_ROOT__ / __DATA_ROOT__ sont substitués par
# `make cron-install` depuis ce checkout et .env.shared — ne jamais les écrire
# en dur, y compris dans un commentaire : la substitution réécrit tout le
# fichier, commentaires compris.
#
# Pourquoi : aucun de ces fichiers n'était tourné, tous ouverts en `>>`.
# refresh.log dépassait 300 Ko alimenté par DEUX crons */5, et .clearr.log
# grossissait de ~95 Ko/jour en niveau DEBUG (~35 Mo/an). Le vrai coût n'est pas
# la place : c'est qu'une trace d'erreur y devient introuvable au milieu de
# milliers de lignes identiques.

# copytruncate partout : les producteurs (cron, uvicorn dans le conteneur
# clearr, Traefik) gardent leur descripteur ouvert sur le fichier. Sans lui, la
# rotation renomme l'inode et tout continue de s'écrire dans le fichier
# renommé — le "nouveau" log resterait vide indéfiniment.

__REPO_ROOT__/dashboard/refresh.log
__REPO_ROOT__/arr/recyclarr-sync.log
__REPO_ROOT__/arr/apply-overrides.log
__REPO_ROOT__/arr/search-missing.log
__REPO_ROOT__/sauvegarde/backup.log {
    weekly
    rotate 4
    copytruncate
    compress
    delaycompress
    notifempty
    missingok
}

# Journal applicatif de clearr. Plus volumineux que les précédents (une ligne
# par requête RPC), d'où une rétention plus courte.
__DATA_ROOT__/.clearr.log {
    weekly
    rotate 4
    copytruncate
    compress
    delaycompress
    notifempty
    missingok
}

# Access log Traefik (voir accessLog dans traefik/traefik.yml). Le seul à
# grossir proportionnellement au trafic WAN, donc quotidien : c'est aussi celui
# qu'on veut pouvoir relire par jour après un incident.
__DATA_ROOT__/.traefik/log/access.log {
    daily
    rotate 14
    copytruncate
    compress
    delaycompress
    notifempty
    missingok
}
