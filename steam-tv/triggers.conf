# Touches multimédia sur tty3 → /usr/local/bin/steam-tv-key. Valeur 1 = appui, 2 = répétition (touche maintenue).
KEY_VOLUMEUP       1 /usr/local/bin/steam-tv-key up
KEY_VOLUMEUP       2 /usr/local/bin/steam-tv-key up
KEY_VOLUMEDOWN     1 /usr/local/bin/steam-tv-key down
KEY_VOLUMEDOWN     2 /usr/local/bin/steam-tv-key down
KEY_MUTE           1 /usr/local/bin/steam-tv-key mute
KEY_BRIGHTNESSUP   1 /usr/local/bin/steam-tv-key b-up
KEY_BRIGHTNESSUP   2 /usr/local/bin/steam-tv-key b-up
KEY_BRIGHTNESSDOWN 1 /usr/local/bin/steam-tv-key b-down
KEY_BRIGHTNESSDOWN 2 /usr/local/bin/steam-tv-key b-down
