# Le paquet (triggerhappy 0.5.0-2) déclare un socket en flux, mais th-cmd parle en
# datagrammes : chaque ajout à chaud par la règle udev échoue (« Transport endpoint is
# not connected »). thd ne voit alors que les périphériques présents à son démarrage,
# pas le clavier virtuel qu'input-remapper crée ensuite (touches luminosité).
# Installé dans /etc/systemd/system/triggerhappy.socket.d/datagram.conf par steam-tv/install-root.sh.
[Socket]
ListenStream=
ListenDatagram=/run/thd.socket
