# Autologin sur tty3 pour Steam Big Picture (steam-tv lancé par ~/.zprofile).
# Installé dans /etc/systemd/system/getty@tty3.service.d/ par steam-tv/install-root.sh (__USER__ substitué).
[Service]
ExecStart=
ExecStart=-/usr/sbin/agetty --autologin __USER__ --noreset --noclear --issue-file=/etc/issue:/etc/issue.d:/run/issue.d:/usr/lib/issue.d - ${TERM}
