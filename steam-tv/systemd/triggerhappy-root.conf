# thd reste root : en « nobody » (défaut du paquet), il ne peut pas ouvrir les claviers
# branchés après son démarrage, dont le périphérique virtuel d'input-remapper.
# Installé dans /etc/systemd/system/triggerhappy.service.d/root.conf par steam-tv/install-root.sh.
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --user root --deviceglob /dev/input/event*
