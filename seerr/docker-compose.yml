services:
  seerr:
    # Jellyseerr et Overseerr ont fusionné dans un projet unique, Seerr
    # (https://docs.seerr.dev) — les deux anciens projets sont dépréciés.
    # Migre automatiquement une éventuelle base Jellyseerr/Overseerr existante
    # au premier démarrage, sans action manuelle.
    image: ghcr.io/seerr-team/seerr:latest
    restart: unless-stopped
    init: true
    # Contrairement aux images linuxserver.io (arr/), celle-ci tourne déjà en
    # non-root nativement (utilisateur `node`, UID 1000) — pas besoin du
    # montage tmpfs /run ni d'un cap_add pour démarrer.
    user: "${PUID}:${PGID}"
    volumes:
      - ${DATA_ROOT}/.seerr/config:/app/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik-public
      # Joint sonarr:8989/radarr:7878 en direct, sans Traefik (où ils sont
      # LAN-only), par un réseau qui ne contient qu'eux. PAS arr_default
      # (jusqu'au 2026-11-17) : Seerr, exposé au WAN, y lisait aussi la clé
      # API de Prowlarr sur /initialize.json (les arr n'ont pas de login depuis
      # une IP privée) et joignait cross-seed.
      - seerr-arr
    healthcheck:
      # /status/appdata et PAS /status : ce dernier interroge l'API GitHub pour
      # savoir s'il existe une version plus récente, donc une panne de GitHub
      # (ou une sortie Internet coupée — vu le 2026-09-29 en restaurant sur une
      # VM isolée) faisait passer Seerr unhealthy, et Traefik cessait de le
      # servir. appdata est purement local et vérifie en prime ce qui a déjà
      # cassé ici : volume de config monté et inscriptible (EACCES en root).
      # Il répond 200 dans tous les cas, d'où le test du contenu.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5055/api/v1/status/appdata | grep -q '\"appDataPermissions\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)"
      - "traefik.http.routers.seerr.entrypoints=websecure"
      - "traefik.http.routers.seerr.tls.certresolver=letsencrypt"
      # hsts/security-headers/rate-limit définis une seule fois dans
      # traefik/docker-compose.yml, voir CLAUDE.md
      - "traefik.http.routers.seerr.middlewares=rate-limit@docker,security-headers@docker,hsts@docker"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

networks:
  traefik-public:
    external: true
  seerr-arr:
    external: true
    # Créé par arr/docker-compose.yml, qui ne fixe pas de `name:` de projet
    # compose : le nom est préfixé par le dossier (arr_seerr-arr) — même
    # logique que vpn_vpn-internal dans arr/docker-compose.yml.
    name: arr_seerr-arr
