<div class="stat stat-span-3 stat-tracker">
  <div class="stat-header-row">
    <span class="stat-label">Ratio par tracker</span>
    <label class="switch-row">
      <span class="switch-label">Trackers privés</span>
      <span class="switch">
        <input type="checkbox" id="tracker-all-toggle">
        <span class="switch-slider"></span>
      </span>
      <span class="switch-label">Tous les trackers</span>
    </label>
  </div>
  <table class="tracker-table">
    <thead><tr><th>Tracker</th><th>Ratio</th><th>Envoyé</th><th>Reçu</th></tr></thead>
    <tbody>
$rows
    </tbody>
  </table>
</div>
