log:
  level: INFO

entryPoints:
  web:
    address: ":8080"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":8443"
  # Bound to loopback only, never published in docker-compose.yml's `ports:`
  # — used solely by the container's own healthcheck (see docker-compose.yml),
  # kept off `web`/`websecure` so the http->https redirection above doesn't
  # apply to it and it isn't reachable from outside the container.
  healthcheck:
    address: "127.0.0.1:8082"

ping:
  entryPoint: healthcheck

providers:
  docker:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: traefik-public
  # Middlewares that must be switchable WITHOUT recreating a container: a
  # middleware declared through docker labels can only change by recreating the
  # container carrying it, which rules out flipping it on and off. Here that is
  # the LAN-only ipAllowList of the arr/transmission routers — see
  # scripts/lan-only-middleware.sh and `make switch-lan-only-middleware`.
  # `watch: true` reloads the file in place, no container restart at all.
  # A directory, not a single file: a bind-mounted *file* keeps the inode it had
  # at container start, so replacing it on the host would go unnoticed inside the
  # container (see CLAUDE.md).
  file:
    directory: /dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # email supplied via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
      # (traefik/.env, not versioned — see traefik/.env.example)
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web
