services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - TASKS=1
      - LOG_LEVEL=warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - socket-proxy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    depends_on:
      - socket-proxy
    environment:
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Dynamic (hot-reloaded) configuration — the LAN-only middlewares, see the
      # `file` provider in traefik.yml. Mounted as a directory so replacing a
      # file inside it is seen by the container; its content is generated by
      # scripts/lan-only-middleware.sh (holds LAN_CIDR, hence gitignored).
      - ./dynamic:/dynamic:ro
      - ./letsencrypt:/letsencrypt
      - /etc/localtime:/etc/localtime:ro
    networks:
      - socket-proxy
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      # Pas de routeur ici (Traefik ne se reverse-proxy pas lui-même) : juste
      # des déclarations de middlewares, réutilisables par toutes les stacks
      # via `hsts@docker`/`security-headers@docker` dans leurs propres
      # labels `...routers.<x>.middlewares` — évite de dupliquer les mêmes
      # valeurs dans chaque stack.
      - "traefik.enable=true"
      - "traefik.http.middlewares.hsts.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.hsts.headers.forceSTSHeader=true"
      # noindex : serveur perso, aucun service ne doit être indexé/appris par
      # un crawler (moteur de recherche ou entraînement IA) ; frameDeny,
      # nosniff, referrerPolicy : durcissement standard sans lien avec
      # l'indexation. Générique à tous les services, pas propre au dashboard.
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow, noarchive"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=no-referrer"
      # Anti-bruteforce léger pour Jellyfin/Seerr (Nextcloud a le sien
      # intégré) — limite par IP source, pas un vrai ban après échecs
      # d'authentification (Traefik seul ne sait pas inspecter les codes
      # de réponse pour ça, cf. CLAUDE.md). Valeurs généreuses exprès :
      # s'applique à tout le router, pas qu'à l'endpoint de login, donc
      # doit encaisser l'usage normal (Jellyfin charge plusieurs images de
      # bibliothèque en parallèle) sans le limiter.
      - "traefik.http.middlewares.rate-limit.ratelimit.average=50"
      - "traefik.http.middlewares.rate-limit.ratelimit.burst=100"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

  # Page statique de liens vers les services (public/local/arrêté) — Traefik
  # ne sait servir aucun fichier statique lui-même (pur reverse-proxy, pas de
  # provider "fichiers"), un backend HTTP minimal reste donc nécessaire.
  # Contenu dans ../dashboard/ (assets versionnés + html/ généré par
  # scripts/generate-dashboard.sh, voir CLAUDE.md), regroupé ici plutôt que
  # dans un stack séparé : c'est un backend d'ingress, pas un service à lui.
  # Même image que vpn/transmission-proxy : écoute en 8080 sans cap_add.
  dashboard:
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped
    volumes:
      - ../dashboard/html:/usr/share/nginx/html:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      # Accessible en WAN comme en LAN : la page liste aussi les sous-domaines
      # LAN-only (arr/transmission), mais leurs cartes sont grisées côté client
      # par un probing JS (voir scripts/generate-dashboard.sh) qui détecte le
      # 403 renvoyé par leur propre ipallowlist quand l'appelant est sur le WAN.
      # hsts/security-headers définis une seule fois plus haut sur ce même
      # container, voir CLAUDE.md. X-Robots-Tag redondant avec la balise
      # <meta robots> du HTML généré : couvre aussi les crawlers qui ne
      # parsent pas le HTML (ou tapent une ressource non-HTML, ex. les logos).
      - "traefik.http.routers.dashboard.middlewares=security-headers@docker,hsts@docker"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

networks:
  socket-proxy:
    internal: true
  traefik-public:
    external: true
